name: CI - TPHP StudyTrack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client & Database
      run: |
        npx prisma generate
        npx prisma db push
        npm run seed
      env:
        DATABASE_URL: "file:./prisma/tphp_studytrack.db"
        JWT_SECRET: "ci-test-secret-key"

    - name: Run Test Suite (10 Alur Utama)
      run: npm test
      env:
        DATABASE_URL: "file:./prisma/tphp_studytrack.db"
        JWT_SECRET: "ci-test-secret-key"

    - name: Run Next.js Production Build
      run: npm run build
      env:
        DATABASE_URL: "file:./prisma/tphp_studytrack.db"
        JWT_SECRET: "ci-test-secret-key"
